
<div class="flex flex-col items-center justify-center h-screen">
  <h2 class="text-2xl font-bold mb-6">Login Page</h2>
  <input 
    type="text" 
    placeholder="Username"
    class="border border-gray-500 rounded w-96 h-10 px-3 mb-4">
  <input 
    type="password" 
    placeholder="Password"
    class="border border-gray-500 rounded w-96 h-10 px-3 mb-4">
  <button 
    (click)="loginFunc()" 
    class="bg-blue-500 text-white rounded w-96 h-10 hover:bg-blue-600">
    Login
  </button>
</div>
