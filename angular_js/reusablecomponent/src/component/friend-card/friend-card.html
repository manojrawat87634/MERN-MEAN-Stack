<div class="flex items-center justify-between p-2 rounded hover:bg-gray-100">
  <div class="flex items-center space-x-3">
    <img [src]="data.profilePic" alt="{{data.name}}" class="w-12 h-12 rounded-full object-cover">
    <div>
      <p class="font-semibold">{{ data.name }}</p>
      <p class="text-gray-500 text-sm">@{{ data.username }}</p>
    </div>
  </div>
  <button 
    class="px-3 py-1 rounded text-white text-sm"
    [ngClass]="data.isFollowing ? 'bg-gray-400' : 'bg-blue-500'"
    (click)="toggleFollow()"
  >
    {{ data.isFollowing ? 'Following' : 'Follow' }}
  </button>
</div>
