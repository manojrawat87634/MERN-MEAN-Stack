<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .email{
            color: red;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        fetch('http://localhost:3000/user/')
            .then(response => response.json())
            .then(data => {
                // console.log(data);
                data.forEach((e, index)=>{
                    document.getElementById('root').innerHTML = (`<h1 class='email'>${index+1} - ${e.email} </h1><br>`);
                })
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    </script>
</body>
</html>
